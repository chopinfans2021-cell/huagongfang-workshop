<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>化学工坊 · 第一天</title>
<style>
:root{--bg:#241438;--panel:#1a1028;--cream:#f4efe4;--brass:#e4c56a}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Noto Sans SC",sans-serif;background:#241438;color:var(--cream)}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;background:#140c20;border-bottom:3px solid #000}
header b{color:var(--brass);font-size:18px}
.stat{background:#0003;padding:4px 8px;border-radius:8px}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;gap:12px;padding:12px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:#1a1028;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px;border-radius:10px}
h2{margin:0 0 8px;font-size:15px;color:var(--brass)}
button{border:2px solid #000;background:#3a2a52;color:var(--cream);padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit}
button.good{background:#21543a}button.bad{background:#6a2030}button.warn{background:#7a3a12}
.eq{font-family:"Times New Roman",serif;font-size:26px;color:var(--brass);margin:0 0 10px}
.bench{height:220px;background:linear-gradient(#2a1a18,#4a2a18);border:3px solid #000;border-radius:8px;position:relative;overflow:hidden}
.bench.qte{background:linear-gradient(#4a1018,#2a0810)}
.beaker{position:absolute;left:50%;top:28px;transform:translateX(-50%);width:88px;height:150px;border:4px solid #fff;border-top:0;border-radius:0 0 18px 18px}
.liquid{position:absolute;left:0;right:0;bottom:0;height:42%;background:#f4f0e4}
.cd{position:absolute;right:10px;top:8px;font-size:42px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #fff1;font-size:13px}
.mask{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}
.ledger{background:#1a1028;border:3px solid #000;padding:18px;width:min(420px,92vw)}
.msg{min-height:22px;color:#ffd0a8;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header>
  <b>化学工坊</b>
  <span class="stat" id="gold">200 金</span>
  <span class="stat" id="rs">研发 0</span>
  <span class="stat" id="rep">声望 12</span>
  <span class="stat" id="day">第 1 天</span>
  <button onclick="resetSave()">清档</button>
</header>
<div class="grid">
  <section class="card"><h2>原料架</h2>
    <div class="row"><button id="gInd" onclick="setGrade('industrial')">工业 80%</button><button id="gReg" class="good" onclick="setGrade('reagent')">试剂 95%</button></div>
    <div id="shop"></div>
  </section>
  <section class="card">
    <p class="eq" id="eq">选一条 T1 配方</p>
    <div class="bench" id="bench"><div class="beaker"><div class="liquid" id="liq"></div></div><div class="cd" id="cd"></div></div>
    <div class="row" id="recipes"></div>
    <div class="row" id="acts"></div>
    <div class="msg" id="msg"></div>
    <div class="msg" id="scars"></div>
  </section>
  <section class="card"><h2>订单与零售</h2>
    <div id="contract"></div><div id="stock"></div>
    <div class="row" style="margin-top:10px"><button class="good" onclick="buyScale()">天平 80金+5研发</button><button class="warn" onclick="endDay()">结束今天</button></div>
  </section>
</div>
<div class="mask" id="ledger"><div class="ledger" id="ledgerBody"></div></div>
<script src="game.js"></script>
</body>
</html>
